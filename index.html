<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Guessing Game</title><link rel="icon" href="assets/app_icon.ico"><style>
*{box-sizing:border-box}body{margin:0;background:#ff982e;color:#17120c;font:16px system-ui}main{max-width:900px;margin:auto;padding:24px;text-align:center}h1{font:bold clamp(29px,6vw,48px) 'Trebuchet MS',sans-serif;margin:10px 0}button{font:inherit;font-weight:700;color:inherit;background:white;border:2px solid #22180f;border-radius:12px;padding:12px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #16487d;outline-offset:4px}button:disabled{cursor:default}nav{display:flex;gap:10px;margin:20px 0}.tiles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.levels{display:grid;gap:10px;max-width:420px;margin:20px auto}.scene{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px auto}.scene img{height:170px;width:auto;max-width:40%;object-fit:contain}.home img{height:237px}.bubble{position:relative;background:white;border:2px solid #22180f;border-radius:16px;padding:14px;max-width:255px;text-align:left}.bubble:after{content:"";position:absolute;right:-8px;top:32%;width:12px;height:12px;background:white;border-top:2px solid;border-right:2px solid;transform:rotate(45deg)}.boards{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:18px auto}.boards.human{justify-content:center}.digits{display:flex;gap:7px;justify-content:center}.digits input,.digit{width:clamp(42px,12vw,57px);height:52px;font:bold 34px monospace;text-align:center;color:inherit}.digits input{border:0;border-bottom:3px solid currentColor;background:transparent;border-radius:0}.lamp{display:block;padding:0;width:27px;height:27px;border-radius:50%;margin:5px auto;border:2px solid #222;background:var(--light)}.lamp[aria-pressed=true]{outline:3px solid white}.lamps{background:#222;border-radius:10px;padding:3px;margin:4px auto;width:40px}.attempts{text-align:left;font-weight:800}.hint{font-size:.9rem}h2{margin:.5em 0} @media(max-width:520px){main{padding:14px}.boards{justify-content:center}.scene{gap:12px}.bubble{font-size:.9rem}}
</style><main><h1>Number Guessing Game</h1><p>Every mistake you make brings you one step closer to the truth.</p><div id="app"></div></main><script src="game.js"></script></html>
